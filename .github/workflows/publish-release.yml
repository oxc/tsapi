name: Publish

on:
  release:
    types: [published]
  # allows re-publishing without cutting a new release
  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable pnpm

      # no registry-url on purpose: it writes an .npmrc _authToken line that
      # expands to the empty string without NODE_AUTH_TOKEN, which stops the
      # trusted publishing (OIDC) token exchange from being attempted
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish with latest tag
        if: "!github.event.release.prerelease"
        run: pnpm packages:publish --tag latest --access public

      - name: Publish with next tag
        if: "github.event.release.prerelease"
        run: pnpm packages:publish --tag next --access public
